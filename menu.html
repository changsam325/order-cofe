<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#211812">
    <meta name="description" content="瀏覽晨焙 Coffee Atelier 咖啡、手沖與甜點菜單。">
    <title>咖啡菜單｜晨焙 Coffee Atelier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <script type="module" src="./assets/js/menu.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav wrap" aria-label="主要導覽">
        <a class="brand" href="./index.html" aria-label="晨焙首頁"><span class="brand-mark" aria-hidden="true">晨</span><span>晨焙 <small lang="en">COFFEE ATELIER</small></span></a>
        <div class="nav-links"><a href="./index.html">品牌首頁</a><a href="./menu.html" aria-current="page">咖啡菜單</a><a href="./order.html">訂單查詢</a><a href="./admin.html">店家管理</a></div>
        <div class="nav-actions"><a href="./cart.html" aria-label="購物袋，0 件">購物袋 <span class="cart-count" data-cart-count aria-live="polite">0</span></a><a class="nav-cta" href="./menu.html">開始點餐 ↗</a><button class="nav-toggle" type="button" aria-expanded="false" aria-label="開啟導覽選單">選單</button></div>
      </nav>
      <div class="mobile-nav wrap"><a href="./index.html">品牌首頁</a><a href="./menu.html">咖啡菜單</a><a href="./cart.html">購物袋（<span data-cart-count>0</span>）</a><a href="./order.html">訂單查詢</a><a href="./admin.html">店家管理</a></div>
    </header>
    <main class="page-main">
      <section class="page-hero"><div class="wrap page-heading"><div><div class="eyebrow">A cup for every moment</div><h1>咖啡菜單</h1></div><p>嚴選產地、每日新鮮製作。挑選喜歡的風味，客製專屬於你的日常一杯。</p></div></section>
      <section class="page-body wrap">
        <div class="filter-row">
          <div class="category-list" aria-label="商品分類"><button class="chip is-active" type="button" data-category="全部" aria-pressed="true">全部</button><button class="chip" type="button" data-category="義式咖啡" aria-pressed="false">義式咖啡</button><button class="chip" type="button" data-category="手沖精品" aria-pressed="false">手沖精品</button><button class="chip" type="button" data-category="嚴選茶飲" aria-pressed="false">嚴選茶飲</button><button class="chip" type="button" data-category="特調氣泡" aria-pressed="false">特調氣泡</button><button class="chip" type="button" data-category="無咖啡因" aria-pressed="false">無咖啡因</button><button class="chip" type="button" data-category="手作甜點" aria-pressed="false">手作甜點</button></div>
          <label class="sr-only" for="menu-search">搜尋菜單</label><input id="menu-search" class="search-input" type="search" placeholder="搜尋咖啡、風味…">
        </div>
        <p id="menu-result-count" class="muted" aria-live="polite">載入商品中…</p>
        <div id="menu-products" class="coffee-grid" data-product-list aria-live="polite"></div>
      </section>
    </main>
    <section class="page-body wrap" id="page-error" hidden><div class="empty-state" role="alert"><h2>目前無法載入商品資料</h2><p>請確認網站是透過本機伺服器開啟，並重新載入頁面。</p><button class="button" type="button" data-reload-page>重新載入</button></div></section>
    <footer class="site-footer"><div class="footer-inner wrap"><a class="brand" href="./index.html" aria-label="晨焙首頁"><span class="brand-mark" aria-hidden="true">晨</span><span>晨焙 <small lang="en">COFFEE ATELIER</small></span></a><div>© 晨焙 <span lang="en">Coffee Atelier</span>　｜　前端展示版</div><div class="footer-links"><a href="./menu.html">咖啡菜單</a><a href="./order.html">訂單查詢</a><a href="./admin.html">店家管理</a></div></div></footer>
    <dialog class="modal" aria-labelledby="modal-title"><form method="dialog" class="modal-content" id="customize-form">
      <div class="modal-header"><div><div class="eyebrow" data-product-category></div><h2 id="modal-title"></h2><p data-product-description></p></div><button class="modal-close" type="button" data-close-modal aria-label="關閉">×</button></div>
      <div class="form-grid">
        <div class="field" data-option="size"><label for="drink-size">容量</label><select id="drink-size" name="size"><option value="中杯">中杯（預設）</option><option value="大杯">大杯（+ NT$ 20）</option></select></div>
        <div class="field" data-option="temperature"><label for="drink-temp">冷熱</label><select id="drink-temp" name="temperature"><option value="熱飲">熱飲</option><option value="少冰">少冰</option><option value="正常冰">正常冰</option></select></div>
        <div class="field" data-option="sugar"><label for="drink-sugar">甜度</label><select id="drink-sugar" name="sugar"><option>無糖</option><option selected>半糖</option><option>正常糖</option></select></div>
        <div class="field field-wide" data-option="oat"><label><input type="checkbox" name="extraOat"> 更換燕麥奶（+ NT$ 15）</label></div>
      </div>
      <div class="field" style="margin-top:16px"><label for="quantity">數量</label><input id="quantity" name="quantity" type="number" min="1" max="20" value="1" required></div>
      <div class="modal-actions"><button class="button-secondary" type="button" data-close-modal>取消</button><button class="button" type="submit">加入購物袋</button></div>
    </form></dialog><div class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
